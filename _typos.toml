# Spell check config for `mise run lint:typos`. typos only knows English, so
# German text is skipped instead of allowlisted word by word.
[files]
extend-exclude = [
  "config/locales/*de.yml",
  # The app's specs assert German UI strings throughout.
  "/spec/",
  "app/assets/stylesheets/inter-font.css",
  "vendor/",
  "app/assets/builds/",
  "*.svg",
  # Generated from Flowbite's docs. Its ids must match theirs, typos included.
  "gems/gustwave/lookbook/flowbite.yml",
]

[default]
extend-ignore-re = [
  # The `de:` block of a component's translation file, up to the next
  # top-level key.
  "(?ms)^de:$.*?(?:\\z|^\\S)",
]

[default.extend-words]
# Devise module name
rememberable = "rememberable"
# Deliberate misspellings that test "Did you mean" errors
buton = "buton"
sise = "sise"
tagg = "tagg"
