---
status: alpha
constructor:
- text (optional)
- 'status: (optional)'
- 'icon: (optional)'
- 'position: (optional)'
- 'id: (optional)'
- 'dismissible: (optional)'
- 'auto_remove: (optional)'
- "**options"
options:
  position:
    default: none
    values:
    - top_left
    - top_center
    - top_right
    - bottom_left
    - bottom_center
    - bottom_right
    - none
  status:
    default: none
    values:
    - info
    - notice
    - success
    - error
    - failure
    - warning
    - alert
    - none
derived:
  status_icon:
    from: status
parts:
- dismiss_button
- message
- visual
- visual_box
slots:
  dismiss_button:
    many: false
  visuals:
    many: true
    types:
    - icon
    - image
    - indicator
    - renderable
    - svg
methods:
- default_dismiss_button
- dismiss_button
- dismiss_button?
- dismissible?
- visuals
- visuals?
- with_dismiss_button
- with_dismiss_button_content
- with_visual
- with_visual_content
- with_visual_icon
- with_visual_icon_content
- with_visual_image
- with_visual_image_content
- with_visual_indicator
- with_visual_indicator_content
- with_visual_renderable
- with_visual_renderable_content
- with_visual_svg
- with_visual_svg_content
- with_visuals
class_methods:
- renders_visuals
- visual_icon_theme
- visual_icon_theme=
slot_builders:
- build_slot_dismiss_button
- build_slot_visual_icon
- build_slot_visual_image
- build_slot_visual_indicator
- build_slot_visual_renderable
- build_slot_visual_svg
