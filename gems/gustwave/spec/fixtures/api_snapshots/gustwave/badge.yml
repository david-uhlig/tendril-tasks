---
status: alpha
constructor:
- text (optional)
- 'tag: (optional)'
- 'type: (optional)'
- 'color: (optional)'
- 'size: (optional)'
- 'pill: (optional)'
- 'border: (optional)'
- 'outline: (optional)'
- "**options"
options:
  border:
    default: 'false'
  color:
    default: default
    values:
    - base
    - default
    - dark
    - red
    - green
    - yellow
    - indigo
    - purple
    - pink
    - none
  outline:
    default: 'false'
  pill:
    default: 'false'
  size:
    default: xs
    values:
    - xs
    - sm
    - md
    - lg
    - xl
    - 2xl
    - none
  tag:
    default: span
    values:
    - div
    - span
    - button
    - a
  type:
    default: none
    values:
    - none
    - button
    - submit
    - reset
derived:
  dismiss_button_color:
    from: color
  dismiss_button_size:
    from: size
  indicator_size:
    from: size
parts:
- dismiss_button
- dismiss_icon
- visual
slots:
  dismiss_button:
    many: false
  leading_visuals:
    many: true
    types:
    - icon
    - image
    - indicator
    - renderable
    - svg
  trailing_visuals:
    many: true
    types:
    - icon
    - image
    - indicator
    - renderable
    - svg
methods:
- dismiss_button
- dismiss_button?
- id
- leading_visuals
- leading_visuals?
- trailing_visuals
- trailing_visuals?
- with_dismiss_button
- with_dismiss_button_content
- with_leading_visual
- with_leading_visual_content
- with_leading_visual_icon
- with_leading_visual_icon_content
- with_leading_visual_image
- with_leading_visual_image_content
- with_leading_visual_indicator
- with_leading_visual_indicator_content
- with_leading_visual_renderable
- with_leading_visual_renderable_content
- with_leading_visual_svg
- with_leading_visual_svg_content
- with_leading_visuals
- with_trailing_visual
- with_trailing_visual_content
- with_trailing_visual_icon
- with_trailing_visual_icon_content
- with_trailing_visual_image
- with_trailing_visual_image_content
- with_trailing_visual_indicator
- with_trailing_visual_indicator_content
- with_trailing_visual_renderable
- with_trailing_visual_renderable_content
- with_trailing_visual_svg
- with_trailing_visual_svg_content
- with_trailing_visuals
class_methods:
- renders_visuals
- visual_icon_theme
- visual_icon_theme=
slot_builders:
- build_slot_dismiss_button
- build_slot_leading_visual_icon
- build_slot_leading_visual_image
- build_slot_leading_visual_indicator
- build_slot_leading_visual_renderable
- build_slot_leading_visual_svg
- build_slot_trailing_visual_icon
- build_slot_trailing_visual_image
- build_slot_trailing_visual_indicator
- build_slot_trailing_visual_renderable
- build_slot_trailing_visual_svg
