---
status: alpha
constructor:
- text
- 'icon: (optional)'
- 'tag: (optional)'
- 'color: (optional)'
- 'shape: (optional)'
- 'label_display: (optional)'
- 'label_placement: (optional)'
- "**options"
options:
  color:
    default: default
    values:
    - default
    - none
  label_display:
    default: tooltip
    values:
    - tooltip
    - inside
    - outside
    - none
  label_placement:
    default: left
    values:
    - left
    - right
    - top
    - bottom
    - none
  shape:
    default: round
    values:
    - round
    - square
    - none
  tag:
    default: button
    values:
    - button
    - a
parts:
- inside_label
- outside_label
- visual
slots:
  visuals:
    many: true
    types:
    - icon
    - image
    - indicator
    - renderable
    - svg
methods:
- visuals
- visuals?
- with_visual
- with_visual_content
- with_visual_icon
- with_visual_icon_content
- with_visual_image
- with_visual_image_content
- with_visual_indicator
- with_visual_indicator_content
- with_visual_renderable
- with_visual_renderable_content
- with_visual_svg
- with_visual_svg_content
- with_visuals
class_methods:
- renders_visuals
- visual_icon_theme
- visual_icon_theme=
slot_builders:
- build_slot_visual_icon
- build_slot_visual_image
- build_slot_visual_indicator
- build_slot_visual_renderable
- build_slot_visual_svg
