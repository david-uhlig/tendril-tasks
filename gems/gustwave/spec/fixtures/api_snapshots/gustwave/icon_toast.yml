---
status: alpha
constructor:
- text (optional)
- 'id: (optional)'
- 'status: (optional)'
- 'position: (optional)'
- 'dismissible: (optional)'
- 'auto_remove: (optional)'
- 'icon: (optional)'
- "**options"
options:
  status:
    default: info
    values:
    - info
    - notice
    - success
    - error
    - failure
    - warning
    - alert
    - none
derived:
  icon:
    from: status
