---
status: alpha
constructor:
- text (optional)
- 'menu_id: (optional)'
- 'icon: (optional)'
- 'trailing_icon: (optional)'
- 'inline: (optional)'
- 'trigger_event: (optional)'
- 'delay: (optional)'
- 'placement: (optional)'
- 'offset_distance: (optional)'
- 'offset_skidding: (optional)'
- "**options"
slots:
