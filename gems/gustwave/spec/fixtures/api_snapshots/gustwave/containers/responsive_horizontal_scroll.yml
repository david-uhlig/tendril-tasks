---
status: alpha
constructor:
- 'tag: (optional)'
- 'breakpoint: (optional)'
- 'snap: (optional)'
- "**options"
options:
  breakpoint:
    default: md
    values:
    - sm
    - md
    - lg
    - xl
    - 2xl
    - none
  snap:
    default: none
    values:
    - start
    - center
    - end
    - none
  tag:
    default: div
    values:
    - div
    - span
    - ul
    - ol
derived:
  item_tag:
    from: tag
slots:
  items:
    many: true
methods:
- items
- items?
- with_item
- with_item_content
- with_items
slot_builders:
- build_slot_item
