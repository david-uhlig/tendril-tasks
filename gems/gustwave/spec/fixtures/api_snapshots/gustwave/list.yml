---
status: alpha
constructor:
- 'tag: (optional)'
- 'marker: (optional)'
- 'color: (optional)'
- 'orientation: (optional)'
- 'nested: (optional)'
- 'divided: (optional)'
- "**options"
options:
  color:
    default: default
    values:
    - default
    - none
  divided:
    default: 'false'
  marker:
    default: disc
    values:
    - disc
    - decimal
    - none
  nested:
    default: 'false'
  orientation:
    default: vertical
    values:
    - vertical
    - horizontal
  tag:
    default: ul
    values:
    - ul
    - ol
derived:
  default_marker:
    from: tag
slots:
  items:
    many: true
methods:
- items
- items?
- with_item
- with_item_content
- with_items
slot_builders:
- build_slot_item
