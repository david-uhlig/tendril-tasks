---
status: alpha
constructor:
- text (optional)
- 'href:'
- 'icon: (optional)'
- 'size: (optional)'
- 'active: (optional)'
- "**options"
options:
  active:
    default: 'false'
  size:
    default: sm
    values:
    - sm
    - md
    - none
parts:
- icon
slots:
  icon:
    many: false
methods:
- apply_slot_context
- icon
- icon?
- with_icon
- with_icon_content
slot_builders:
- build_slot_icon
