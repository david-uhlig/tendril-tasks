---
status: alpha
constructor:
- text (optional)
- 'icon: (optional)'
- 'trailing_icon: (optional)'
- "**options"
options:
  placement:
    default: bottom
    values:
    - auto
    - auto-start
    - auto-end
    - top
    - top-start
    - top-end
    - bottom
    - bottom-start
    - bottom-end
    - right
    - right-start
    - right-end
    - left
    - left-start
    - left-end
  trigger_event:
    default: click
    values:
    - click
    - hover
parts:
- leading_chevron
- trailing_chevron
