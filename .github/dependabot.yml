# Configures dependabot alerts and version updates.
# For supported ecosystems, see https://docs.github.com/en/code-security/dependabot/ecosystems-supported-by-dependabot/supported-ecosystems-and-repositories
version: 2
updates:
  # Enables version updates for Ruby gems.
  # Monitors `Gemfile` and `Gemfile.lock` in the `root` directory.
  - package-ecosystem: bundler
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Note: creates individual PRs for non-matching dependencies. First match wins.
    groups:
      # Temporarily group tailwind updates. Remove once updated to v4.
      tailwind:
        patterns:
          - "tailwind*"
      production-dependencies:
        dependency-type: production
        update-types:
          - minor
          - patch
      development-dependencies:
        dependency-type: development
    cooldown:
      default-days: 7
      semver-major-days: 14

  # Enables version updates for npm packages.
  # Monitors `package.json` and `package-lock.json` in the `root` directory.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      javascript:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Enables version updates for GitHub Actions.
  # Monitors `.github/workflows/ci.yml` in the `root` directory.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
