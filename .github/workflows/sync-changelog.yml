name: Sync changelog

# When a patch release is tagged on a stable branch, opens a PR that copies its
# changelog section to main and removes its entries from [Unreleased].
# Runs bin/release from main, as the stable branch may not have it.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    # X.Y.0 is released from main, which already has its changelog
    if: ${{ !endsWith(github.ref_name, '.0') }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@14594264cd68ce8a2345dd349bc3d138a4ef85c8 # v1.327.0
        with:
          ruby-version: .ruby-version

      - name: Copy the changelog section and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#v}"
          branch="chore/sync-changelog-${version}"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --create "$branch"

          bin/release sync "$version" > "$RUNNER_TEMP/unmatched.md"
          if git diff --quiet; then
            echo "main already has the changelog of $version"
            exit 0
          fi

          git commit --all --message "Add the $version section to the changelog"
          git push --set-upstream origin "$branch"

          {
            echo "Copies the changelog section of $TAG to main and removes its entries from [Unreleased]."
            if [ -s "$RUNNER_TEMP/unmatched.md" ]; then
              echo
              cat "$RUNNER_TEMP/unmatched.md"
            fi
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "Add the $version section to the changelog" --body-file "$RUNNER_TEMP/body.md"
