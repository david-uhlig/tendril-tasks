name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches-ignore:
      - 'dependabot/**'

# Every job runs on `push`. On `pull_request`, jobs only run for PRs that no
# `push` run covers, i.e. PRs from forks and from Dependabot branches.
# Otherwise each PR commit would run CI twice.

permissions:
  contents: read

jobs:
  scan_ruby:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

  scan_js:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        env:
          ANYWAY_SUPPRESS_VALIDATIONS: true
        run: bin/importmap audit

      - name: Run security audit on npm package dependencies
        run: npm audit

  scan_secrets:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install gitleaks
        uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: gitleaks
          cache: false

      - name: Scan the git history for committed secrets
        run: gitleaks git --no-banner --redact

  lint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      - name: Check that gem and npm package versions match
        run: bin/check-gem-npm-versions

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      - name: Install npm package dependencies
        run: npm ci

      - name: Lint ERB templates
        run: npx herb-lint --github

      - name: Check ERB template formatting
        run: npx herb-format --check

  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork || startsWith(github.head_ref, 'dependabot/')
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libvips

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version
          bundler-cache: true

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: npm

      - name: Install npm package dependencies
        run: npm ci

      - name: Run tests
        env:
          RAILS_ENV: test
        run: bin/rails tailwindcss:build parallel:setup parallel:spec

      - name: Run Gustwave tests
        working-directory: gems/gustwave
        run: bundle exec rspec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/capybara
          if-no-files-found: ignore
