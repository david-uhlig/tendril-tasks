name: Backport

# Label a PR with `backport X-Y-stable` before merging it. Once it's merged, this
# opens a PR that cherry-picks its commit onto X-Y-stable and copies the
# changelog entries it adds. CHANGELOG.md itself rarely applies to a stable
# branch. Comments on the PR if the cherry-pick conflicts.
#
# For a label added after the merge, run it by hand:
#   gh workflow run backport.yml -f pr=123

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr:
        description: Number of the merged PR to backport
        required: true
        type: number

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@e81a8fa391b11a595c1b7ed84177cc0fe02faf83 # v1.328.0
        with:
          ruby-version: .ruby-version

      - name: Open the backport PRs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ inputs.pr }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # The stable branches don't have bin/release, so use main's
          tool="$RUNNER_TEMP/release-tool"
          mkdir -p "$tool"
          cp -r bin script "$tool/"
          gh auth setup-git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$PR" ]; then
            numbers="$PR"
          else
            numbers=$(git rev-list --reverse "$BEFORE..$AFTER" | while read -r sha; do
              gh api "repos/$REPO/commits/$sha/pulls" --jq '.[] | select(.merged_at != null) | .number'
            done)
          fi

          for number in $numbers; do
            pr=$(gh pr view "$number" --json state,title,labels,mergeCommit)
            if [ "$(echo "$pr" | jq --raw-output .state)" != "MERGED" ]; then
              echo "#$number isn't merged"
              continue
            fi
            title=$(echo "$pr" | jq --raw-output .title)
            sha=$(echo "$pr" | jq --raw-output .mergeCommit.oid)
            targets=$(echo "$pr" | jq --raw-output '.labels[].name' | sed -n 's/^backport \([0-9]*-[0-9]*-stable\)$/\1/p')

            for target in $targets; do
              branch="fix/backport-${number}-to-${target}"
              if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
                echo "$branch already exists"
                continue
              fi

              git switch --force --create "$branch" "origin/$target"
              if ruby "$tool/bin/release" backport "$sha" > "$RUNNER_TEMP/output.txt" 2>&1; then
                git push --set-upstream origin "$branch"
                gh pr create --base "$target" --head "$branch" --title "[$target] $title" \
                  --body "Backport of #$number to \`$target\`."
              else
                git cherry-pick --abort 2> /dev/null || true
                git reset --hard --quiet
                {
                  echo "The backport to \`$target\` failed:"
                  echo
                  echo '```'
                  cat "$RUNNER_TEMP/output.txt"
                  echo '```'
                  echo
                  echo "To backport it by hand, run \`bin/release backport $sha\` of a main checkout on a branch off \`$target\`, resolve the conflicts and open the PR."
                } > "$RUNNER_TEMP/comment.md"
                gh pr comment "$number" --body-file "$RUNNER_TEMP/comment.md"
              fi
              git switch --quiet main
            done
          done
