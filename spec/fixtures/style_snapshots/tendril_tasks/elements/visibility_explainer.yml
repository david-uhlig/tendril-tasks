---
element element=[:task, :published, :with_published_project]:
- 'svg aria-hidden="true" data-popover-target="popover-visibility-info" fill="none"
  height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg": h-5
  inline-flex mb-1 me-1.5 w-5'
- path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
- 'div data-popover="" id="popover-visibility-info" role="tooltip": absolute bg-white
  border border-gray-200 dark:bg-gray-800 dark:border-gray-600 dark:text-gray-400
  duration-300 inline-block invisible opacity-0 rounded-lg shadow-xs text-gray-500
  text-sm transition-opacity w-72 z-10'
- 'div: p-3 space-y-2'
- 'h3: dark:text-white font-semibold text-gray-900'
- 'div: gap-2 grid grid-cols-2'
- 'div: bg-green-300 dark:bg-green-400 h-1'
- 'div: bg-green-300 dark:bg-green-400 h-1'
- p
- ul
- 'li: flex items-center'
- 'svg aria-hidden="true" fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg":
  dark:text-green-500 h-5 me-1.5 text-green-400 w-5'
- path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
- 'li: flex items-center mb-1'
- 'svg aria-hidden="true" fill="none" height="24" viewBox="0 0 24 24" width="24" xmlns="http://www.w3.org/2000/svg":
