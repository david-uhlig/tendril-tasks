# Run `mise install` to install tools
[tools]
node = "24"
npm = "latest"
ruby = "3.4.7"

[tasks."ci"]
description = "Run continuous integration suite."
run = [
    { task = "ci:setup" },
    { task = "audit" },
    { task = "brakeman" },
    { task = "rubocop" },
    { task = "test:rspec" },
    { task = "test:seeds" }
]

[tasks."ci:setup"]
description = "Run bin/setup --skip-server"
run = "bin/setup --skip-server"

[tasks."audit"]
description = "Run all audit tasks"
depends = ["audit:*"]

[tasks."audit:gems"]
description = "Security: Gem audit"
run = "bin/bundler-audit"

[tasks."audit:importmap"]
description = "Security: Importmap vulnerability audit"
run = "bin/importmap audit"

[tasks."audit:npm"]
description = "Security: Javascript dependencies audit"
run = "npm audit"

[tasks."brakeman"]
description = "Security: Brakeman code analysis"
run = "bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error"

[tasks."rubocop"]
description = "Style: Ruby"
run = "bin/rubocop -a"

[tasks."test:rspec"]
description = "Tests: RSpec"
run = "env RAILS_ENV=test bin/rails db:setup spec"

[tasks."test:seeds"]
description = "Tests: Seeds"
run = "env RAILS_ENV=test bin/rails db:seed:replant"

[tasks."update"]
description = "Update gems and npm packages"
run = [
    { tasks = ["update:gems", "update:npm"] }
]

[tasks."update:gems"]
description = "Run bundle update --all"
run = "bundle update --all"

[tasks."update:npm"]
description = "Run npm update"
run = "npm update"
