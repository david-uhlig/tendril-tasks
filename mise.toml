# Run `mise install` to install tools
[tools]
node = "24"
npm = "latest"
ruby = "3.4.11"
zizmor = "latest"

[tasks."ci"]
description = "Run the continuous integration suite in parallel."
run = [
    { task = "ci:setup" },
    { tasks = ["audit", "brakeman", "rubocop", "herb", "test:rspec"] },
    { task = "test:seeds" }
]

[tasks."ci:sequential"]
description = "Run the continuous integration suite."
run = [
    { task = "ci:setup" },
    { task = "audit" },
    { task = "brakeman" },
    { task = "rubocop" },
    { task = "herb" },
    { task = "test:rspec" },
    { task = "test:seeds" }
]

[tasks."ci:setup"]
description = "Run bin/setup --skip-server"
run = "bin/setup --skip-server"

[tasks."audit"]
description = "Run all audit tasks"
depends = ["audit:*"]

[tasks."audit:gems"]
description = "Security: Gem audit"
run = "bin/bundler-audit"

[tasks."audit:importmap"]
description = "Security: Importmap vulnerability audit"
run = "bin/importmap audit"

[tasks."audit:npm"]
description = "Security: Javascript dependencies audit"
run = "npm audit"

[tasks."audit:ci"]
description = "Security: GitHub actions workflow audit"
depends = ["zizmor"]

[tasks."brakeman"]
description = "Security: Brakeman code analysis"
run = "bin/brakeman --quiet --no-pager --exit-on-warn --exit-on-error"

[tasks."rubocop"]
description = "Style: Ruby"
run = "bin/rubocop -a"

[tasks."herb"]
description = "Style: ERB"
run = "npx herb-lint"

[tasks."herb:fix"]
description = "Style: ERB (auto fix)"
run = "npx herb-lint --fix"

[tasks.rff]
description = "Alias for `test:rspec:ff`"
depends = ["test:rspec:ff"]

[tasks."test:rspec"]
description = "Tests: RSpec (silent)"
run = "env RAILS_ENV=test bin/rails db:setup spec"

[tasks."test:rspec:ff"]
description = "Tests: RSpec (fail fast; no coverage)"
run = "env RAILS_ENV=test SKIP_COVERAGE=1 bundle exec rspec --format RSpec::AiFormatter::Formatter --fail-fast"
quiet = true

[tasks."test:db:setup"]
description = "Prepare the test database."
run = "env RAILS_ENV=test bin/rails db:setup"
silent = "stderr"

[tasks."test:seeds"]
description = "Tests: Seeds"
run = "env RAILS_ENV=test bin/rails db:seed:replant"

[tasks."update:project"]
description = "Update Ruby, Ruby gems and npm packages."
run = [
    { task = "update:ruby" },
    { tasks = ["update:gems", "update:npm"] }
]

[tasks."update:ruby"]
description = "Update Ruby to the latest patch version."
run = "bin/update-ruby -y"

[tasks."update:gems"]
description = "Update Ruby gems: `bundle update --all`."
run = "bundle update --all"

[tasks."update:npm"]
description = "Update npm packages: `npm update`."
run = "npm update"

[tasks."zizmor"]
description = "Run zizmor security audit. Static analysis for GitHub Actions."
run = "zizmor ./.github"

[tasks."zizmor:fix"]
description = "Run zizmor and auto fix."
run = "zizmor --fix ./.github"
